name: "SCA - Dependency Check"

on:
  push:
    branches: [main, dev, test]
  pull_request:
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install OWASP Dependency-Check
        run: |
          VERSION=10.0.4
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip
          unzip dependency-check-${VERSION}-release.zip

      - name: Run OWASP Dependency Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "cantinas-cinfaes-backend" \
            --scan "./cantinas-cinfaes-backend" \
            --format HTML \
            --out reports \
            --failOnCVSS 7 \
            --enableRetired

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports