#security.yml — SAST + SCA + SBOM + Integration Tests + Secret Scanning + Container Scanning — PR pipeline

name: "Security"

on:
  pull_request:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # SAST — CodeQL
  # ──────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          config-file: .github/codeql-config.yml

      - name: Build with Maven (for CodeQL)
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          output: sarif-results

      - name: Fail on High or Critical CodeQL Alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0

          # ── 1. SARIF (new findings in this run) ──────────────────────────────
          sarif_file="sarif-results/java.sarif"
          if [ -f "$sarif_file" ]; then
            sarif_findings=$(jq -r '
              .runs[] |
              . as $run |
              (
                [
                  ($run.tool.driver.rules // []),
                  ([$run.tool.extensions[]? | .rules? // []] | add // [])
                ] | add // []
              ) as $all_rules |
              (
                $all_rules
                | map({(.id): {sec: (.properties["security-severity"] // "0"), lvl: (.defaultConfiguration.level // "none")}})
                | add // {}
              ) as $id_map |
              $run.results[] |
              . as $r |
              (
                if ($r.ruleId // "") != "" then $r.ruleId
                elif (($r.rule.id? // "") != "") then $r.rule.id
                elif ($r.rule.index? != null) then ($all_rules[$r.rule.index].id // "")
                else "" end
              ) as $rid |
              ($id_map[$rid] // {sec:"0",lvl:"none"}) as $rule |
              (($rule.sec) | tonumber) as $sev |
              select($sev >= 7.0 or $rule.lvl == "error") |
              "  [SARIF] \($rid) (severity \($sev)): \($r.message.text)"
            ' "$sarif_file")

            if [ -n "$sarif_findings" ]; then
              echo "HIGH/CRITICAL findings in SARIF (this run):"
              echo "$sarif_findings"
              failed=1
            else
              echo "SARIF: no HIGH/CRITICAL findings in this run."
            fi
          else
            echo "SARIF file not found — skipping SARIF check."
          fi

          # ── 2. GitHub API (open historical alerts — informational only) ─────────
          # Does not block the pipeline: alerts here may be stale from before this
          # fix PR ran a clean scan. GitHub auto-closes them after a successful run.
          api_findings=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            --paginate | \
            jq -r '.[] |
              select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") |
              "  [API #\(.number)] \(.rule.id) (\(.rule.security_severity_level | ascii_upcase)): \(.most_recent_instance.message.text // .rule.description) @ \(.most_recent_instance.location.path // "unknown"):\(.most_recent_instance.location.start_line // "?")"')

          if [ -n "$api_findings" ]; then
            echo "WARNING — open HIGH/CRITICAL alerts in GitHub Code Scanning (informational):"
            echo "$api_findings"
          else
            echo "GitHub API: no open HIGH/CRITICAL alerts."
          fi

          # ── Result ───────────────────────────────────────────────────────────
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All checks passed."

  # ──────────────────────────────────────────────
  # SCA — OWASP Dependency Check
  # ──────────────────────────────────────────────
  sca:
    name: SCA (OWASP Dependency Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Run OWASP Dependency Check
        working-directory: cantinas-cinfaes-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn org.owasp:dependency-check-maven:check
          -Dnvd.api.key=$NVD_API_KEY
          -Dnvd.api.delay=6000
          -Dnvd.api.maxRetryCount=5
          -DfailBuildOnCVSS=7

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: cantinas-cinfaes-backend/target/dependency-check-report.html

  # ──────────────────────────────────────────────
  # SBOM Generation — CycloneDX Maven Plugin
  # ──────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Generate SBOM
        working-directory: cantinas-cinfaes-backend
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: cantinas-cinfaes-backend/target/bom.json

  # ──────────────────────────────────────────────
  # Integration Tests
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run Integration Tests (with JaCoCo)
        working-directory: cantinas-cinfaes-backend
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn org.jacoco:jacoco-maven-plugin:prepare-agent verify org.jacoco:jacoco-maven-plugin:report -DskipUnitTests -Dspring.profiles.active=test

      - name: Check integration coverage threshold
        working-directory: cantinas-cinfaes-backend
        run: |
          python3 - <<'PY'
          import sys
          try:
              import xml.etree.ElementTree as ET
              tree = ET.parse('target/site/jacoco/jacoco.xml')
              root = tree.getroot()
          except Exception as e:
              print('Failed to read jacoco.xml:', e)
              sys.exit(1)
          pct = None
          for c in root.findall('counter'):
              if c.get('type') == 'LINE':
                  covered = int(c.get('covered'))
                  missed = int(c.get('missed'))
                  total = covered + missed
                  pct = (covered * 100.0 / total) if total > 0 else 0.0
                  print(f'Line coverage: {pct:.2f}% ({covered}/{total})')
                  break
          if pct is None:
              print('No LINE counter found in jacoco report')
              sys.exit(1)
          if pct < 80.0:
              print('Coverage below 80% — failing the step')
              sys.exit(1)
          print('Coverage threshold met')

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: integration-jacoco-report
          path: cantinas-cinfaes-backend/target/site/jacoco

      - name: Upload Integration Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: cantinas-cinfaes-backend/target/failsafe-reports

  # ──────────────────────────────────────────────
  # Secret Scanning
  # ──────────────────────────────────────────────
  # secretDetector.yml

  # ──────────────────────────────────────────────
  # Container/Artifact Scanning
  # ──────────────────────────────────────────────
  container-scanning:
    name: Container Scanning (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build JAR first
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests
      - name: Build Docker image
        run: |
          for i in 1 2 3; do
            docker build -t myapp:${{ github.sha }} cantinas-cinfaes-backend/ && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container