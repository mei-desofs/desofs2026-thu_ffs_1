# Pipeline Secret Detector
# Esta pipeline verifica automaticamente se existem
# secrets expostos no código do projeto.

name: "Secret Detector"

# Define quando a pipeline é executada
on:
  # Executa sempre que existe um Pull Request
  pull_request

jobs:

  # Job responsável por procurar secrets
  check-secrets:

    # Nome apresentado no GitHub Actions
    name: Checking for Secrets

    # Usa máquina Ubuntu fornecida pelo GitHub
    runs-on: ubuntu-latest

    steps:

      # Faz checkout do repositório
      - name: Checkout Repo
        uses: actions/checkout@v3

        with:
          # Faz download do histórico completo do Git
          # necessário para comparar alterações e procurar secrets antigos
          fetch-depth: 0


      # Executa scanner de secrets
      # Procura informações sensíveis expostas no código
      - name: Secret Scanner
        uses: secret-scanner/action@0.0.2

        # Esta ferramenta pode detetar:
        # - API Keys
        # - Passwords
        # - Tokens JWT
        # - Chaves privadas
        # - Secrets hardcoded
        # - Credenciais expostas acidentalmente