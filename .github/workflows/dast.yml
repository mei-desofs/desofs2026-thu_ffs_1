name: "DAST"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

jobs:
  dast:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      issues: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests

      - name: Start Spring Boot application
        working-directory: cantinas-cinfaes-backend
        run: java -jar target/*.jar &
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Wait for application to be ready
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in {1..24}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application is up!"
              exit 0
            fi
            echo "Attempt $i/24 — retrying in 5s..."
            sleep 5
          done
          echo "Application never became healthy after 120s"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          issue_title: 'ZAP Baseline Scan Report'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json