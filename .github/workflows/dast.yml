name: "DAST - OWASP ZAP"

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  dast:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@v4.0.0

      - name: "Use Node.js 20"
        uses: actions/setup-node@v3.8.1
        with:
          node-version: 20

      - name: "Install dependencies"
        run: npm ci

      - name: "Start application"
        run: npm start &
        env:
          NODE_ENV: test
          # Add any env vars your app needs to start, e.g.:
          # DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: "Wait for application to be ready"
        run: |
          echo "Waiting for app to start..."
          sleep 15
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/

      - name: "OWASP ZAP Baseline Scan"
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'   # Optional: custom rules to ignore false positives
          cmd_options: '-a'                    # -a: include alpha passive scan rules
          fail_action: false                   # Set to true to fail the build on findings