#dast.yml — Full Security Scan + CVE Scan + Artifact Scanning + DAST + Final SBOM — Release pipeline

name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  # ──────────────────────────────────────────────
  # Full Security Scan — CodeQL + Semgrep
  # ─────────────────────────────────────────────
  full-security-scan:
    name: Full Security Scan (CodeQL + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build with Maven
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Semgrep Full Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

  # ──────────────────────────────────────────────
  # Full CVE Scan — OWASP Dependency Check + Trivy Filesystem
  # ─────────────────────────────────────────────
  full-cve-scan:
    name: Full CVE Scan (OWASP DC + Trivy FS)
    runs-on: ubuntu-latest
    needs: full-security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: OWASP Dependency Check
        working-directory: cantinas-cinfaes-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn org.owasp:dependency-check-maven:check
          -Dnvd.api.key=$NVD_API_KEY
          -Dnvd.api.delay=2000
          -Dnvd.api.maxRetryCount=10
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
      - name: Upload CVE Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-cve-report
          path: cantinas-cinfaes-backend/target/dependency-check-report.html

  # ──────────────────────────────────────────────
  # Artifact Scanning
  # ──────────────────────────────────────────────
  artifact-scanning:
    name: Artifact Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: full-cve-scan
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build JAR
        working-directory: cantinas-cinfaes-backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn clean package -DskipTests
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} cantinas-cinfaes-backend/
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────────────────────────────────
  # Dynamic Analysis — OWASP ZAP
  # ──────────────────────────────────────────────
  dast:
    name: Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: cantinasDB
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests
      - name: Start Spring Boot application
        working-directory: cantinas-cinfaes-backend
        run: java -jar target/*.jar &
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Wait for application to be ready
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in {1..24}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application is up!"
              exit 0
            fi
            echo "Attempt $i/24 — retrying in 5s..."
            sleep 5
          done
          echo "Application never became healthy after 120s"
          exit 1
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          issue_title: 'ZAP Baseline Scan Report'
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json

  # ──────────────────────────────────────────────
  # Final SBOM Generation — CycloneDX Maven Plugin
  # ──────────────────────────────────────────────
  final-sbom:
    name: Final SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: full-cve-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Generate Final SBOM
        working-directory: cantinas-cinfaes-backend
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload Final SBOM as Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom-${{ github.ref_name }}
          path: cantinas-cinfaes-backend/target/bom.json

  # ──────────────────────────────────────────────
  # Release Publication
  # ──────────────────────────────────────────────
  release:
    name: Release Publication
    runs-on: ubuntu-latest
    needs: [artifact-scanning, dast, final-sbom]
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build project
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cantinas-cinfaes-backend/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}