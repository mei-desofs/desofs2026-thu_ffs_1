#dast.yml — Full Security Scan + CVE Scan + Artifact Scanning + DAST + Final SBOM — Release pipeline

name: "Release"

on:
  push:
    branches:
      - main
      - dev

jobs:
  # ──────────────────────────────────────────────
  # Full Security Scan — CodeQL + Semgrep
  # ─────────────────────────────────────────────
  full-security-scan:
    name: Full Security Scan (CodeQL + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build with Maven
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      - name: Fail on High or Critical CodeQL Alerts
        run: |
          sarif_file="sarif-results/java.sarif"
          if [ ! -f "$sarif_file" ]; then
            echo "SARIF file not found — skipping check."
            exit 0
          fi
          findings=$(jq -r '
            .runs[] |
            (
              [
                (.tool.driver.rules // []),
                ([.tool.extensions[]? | .rules? // []] | add // [])
              ] | add // []
              | map({(.id): (.properties["security-severity"] // "0")})
              | add // {}
            ) as $m |
            .results[] |
            . as $r |
            (($m[$r.ruleId] // "0") | tonumber) as $sev |
            select($sev >= 7.0) |
            "\(.ruleId) (severity \($sev)): \(.message.text)"
          ' "$sarif_file")
          if [ -n "$findings" ]; then
            echo "High/critical findings:"
            echo "$findings"
            exit 1
          fi
          echo "No high or critical alerts found."
      - name: Semgrep Full Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

  # ──────────────────────────────────────────────
  # Full CVE Scan — OWASP Dependency Check + Trivy Filesystem
  # ─────────────────────────────────────────────
  full-cve-scan:
    name: Full CVE Scan (OWASP DC + Trivy FS)
    runs-on: ubuntu-latest
    needs: full-security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: OWASP Dependency Check
        working-directory: cantinas-cinfaes-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn org.owasp:dependency-check-maven:check
          -Dnvd.api.key=$NVD_API_KEY
          -Dnvd.api.delay=2000
          -Dnvd.api.maxRetryCount=10
          -DfailBuildOnCVSS=7
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Upload CVE Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-cve-report
          path: cantinas-cinfaes-backend/target/dependency-check-report.html

  # ──────────────────────────────────────────────
  # Artifact Scanning
  # ──────────────────────────────────────────────
  artifact-scanning:
    name: Artifact Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: full-cve-scan
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build JAR
        working-directory: cantinas-cinfaes-backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn clean package -DskipTests
      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} cantinas-cinfaes-backend/
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────────────────────────────────
  # Dynamic Analysis — OWASP ZAP
  # ──────────────────────────────────────────────
  dast:
    name: Dynamic Analysis (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      security-events: write
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: cantinasDB
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests
      - name: Start Spring Boot application
        working-directory: cantinas-cinfaes-backend
        run: java -jar target/*.jar &
        env:
          DB_URL: jdbc:mysql://localhost:3306/cantinasDB
          DB_USERNAME: root
          DB_PASSWORD: testpassword
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          VIRUS_TOTAL: ${{ secrets.VIRUS_TOTAL }}
      - name: Wait for application to be ready
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in {1..24}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application is up!"
              exit 0
            fi
            echo "Attempt $i/24 — retrying in 5s..."
            sleep 5
          done
          echo "Application never became healthy after 120s"
          exit 1
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          fail_action: true
          rules_file_name: '.zap/rules.tsv'
          issue_title: 'ZAP Baseline Scan Report'
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json

  # ──────────────────────────────────────────────
  # Final SBOM Generation — CycloneDX Maven Plugin
  # ──────────────────────────────────────────────
  final-sbom:
    name: Final SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: full-cve-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Generate Final SBOM
        working-directory: cantinas-cinfaes-backend
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload Final SBOM as Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: final-sbom-${{ github.ref_name }}
          path: cantinas-cinfaes-backend/target/bom.json

  # ──────────────────────────────────────────────
  # Release Publication — Create and publish release
  # ──────────────────────────────────────────────
  # This job only runs if all security/scan jobs above have passed.
  # It creates and publishes the release directly with the JAR and SBOM as assets.
  release:
    name: Release Publication
    runs-on: ubuntu-latest
    needs: [artifact-scanning, dast, final-sbom]
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build project
        working-directory: cantinas-cinfaes-backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn clean package -DskipTests

      - name: Read version and set tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.github/.release-please-manifest.json'))['.'])")
          if [ "$BRANCH" = "dev" ]; then
            TAG="v${VERSION}-beta.${RUN_NUMBER}"
            PRERELEASE="true"
          else
            TAG="v${VERSION}"
            PRERELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download Final SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: final-sbom-${{ github.ref_name }}
          path: ./sbom

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            cantinas-cinfaes-backend/target/*.jar \
            ./sbom/bom.json \
            $PRERELEASE_FLAG

  # ──────────────────────────────────────────────
  # Deploy — Push image to GHCR and deploy via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main'
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR
        working-directory: cantinas-cinfaes-backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: cantinas-cinfaes-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cantinas-cinfaes-backend:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cantinas-cinfaes-backend:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/cantinas-cinfaes-backend:${{ needs.release.outputs.tag }}
            docker stop cantinas-app 2>/dev/null || true
            docker rm cantinas-app 2>/dev/null || true
            docker run -d \
              --name cantinas-app \
              --restart unless-stopped \
              -p 2229:8080 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
              -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
              -e JWT_TOKEN="${{ secrets.JWT_TOKEN }}" \
              -e VIRUS_TOTAL="${{ secrets.VIRUS_TOTAL }}" \
              ghcr.io/${{ github.repository_owner }}/cantinas-cinfaes-backend:${{ needs.release.outputs.tag }}
            docker image prune -f
