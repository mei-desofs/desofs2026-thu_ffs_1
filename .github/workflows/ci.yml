#ci.yml — Build + Lint + Unit Tests + Basic SAST + Config Validation — Commit pipeline

name: "CI"

on:
  push:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        working-directory: cantinas-cinfaes-backend
        run: mvn clean package -DskipTests

  # ──────────────────────────────────────────────
  # Lint (Checkstyle)
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run Checkstyle
        working-directory: cantinas-cinfaes-backend
        run: mvn checkstyle:check -Dcheckstyle.config.location=google_checks.xml

  # ──────────────────────────────────────────────
  # Unit Tests
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run Unit Tests (with JaCoCo)
        working-directory: cantinas-cinfaes-backend
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
        run: mvn org.jacoco:jacoco-maven-plugin:prepare-agent test org.jacoco:jacoco-maven-plugin:report

      - name: Check coverage threshold
        working-directory: cantinas-cinfaes-backend
        run: |
          python3 - <<'PY'
          import sys
          try:
              import xml.etree.ElementTree as ET
              tree = ET.parse('target/site/jacoco/jacoco.xml')
              root = tree.getroot()
          except Exception as e:
              print('Failed to read jacoco.xml:', e)
              sys.exit(1)
          pct = None
          for c in root.findall('counter'):
              if c.get('type') == 'LINE':
                  covered = int(c.get('covered'))
                  missed = int(c.get('missed'))
                  total = covered + missed
                  pct = (covered * 100.0 / total) if total > 0 else 0.0
                  print(f'Line coverage: {pct:.2f}% ({covered}/{total})')
                  break
          if pct is None:
              print('No LINE counter found in jacoco report')
              sys.exit(1)
          if pct < 80.0:
              print('Coverage below 80% — failing the step')
              sys.exit(1)
          print('Coverage threshold met')

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: cantinas-cinfaes-backend/target/site/jacoco

      - name: Upload Unit Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: cantinas-cinfaes-backend/target/surefire-reports

  # ──────────────────────────────────────────────
  # Basic SAST (Semgrep)
  # ──────────────────────────────────────────────
  sast-basic:
    name: SAST Basic (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

  # ──────────────────────────────────────────────
  # Configuration Validation
  # ──────────────────────────────────────────────
  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration files
        run: |
          test -f cantinas-cinfaes-backend/src/main/resources/application.properties \
            || test -f cantinas-cinfaes-backend/src/main/resources/application.yml
          echo "Config files present"
      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config --quiet && echo "Docker Compose valid"
          fi