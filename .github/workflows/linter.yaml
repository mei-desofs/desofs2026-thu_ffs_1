name: "Lint"

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - test
  pull_request:

jobs:
  job-1:
    name: Job 1
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@v4.0.0

      - name: "Set up Java 21"
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: "Run Checkstyle"
        working-directory: cantinas-cinfaes-backend
        run: mvn checkstyle:check