name: "Lint"

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - test
  pull_request:

jobs:
  job-1:
    name: Job 1
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@v4.0.0

      - name: "Use Node.js 20"
        uses: actions/setup-node@v3.8.1
        with:
          node-version: 20

      - name: "Install dependencies"
        run: npm ci

      - name: "Run Linter"
        run: npm run lint