name: release-please

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.github/.release-please-manifest.json'))['.'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set tag name
        id: tag
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          RUN_NUMBER="${{ github.run_number }}"

          if [ "$BRANCH" = "dev" ]; then
            TAG="v${VERSION}-beta.${RUN_NUMBER}"
            PRERELEASE="true"
          else
            TAG="v${VERSION}"
            PRERELEASE="false"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" &>/dev/null; then
            echo "Release ${{ steps.tag.outputs.tag }} já existe, a saltar"
          else
            PRERELEASE_FLAG=""
            if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${{ steps.tag.outputs.tag }}" \
              --title "${{ steps.tag.outputs.tag }}" \
              --draft \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG
          fi