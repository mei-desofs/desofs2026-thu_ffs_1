name: "Base example workflow"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@v4.0.0
      - name: "Set up Java 21"
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: "Run tests"
        working-directory: cantinas-cinfaes-backend
        run: mvn test