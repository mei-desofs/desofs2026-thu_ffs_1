# Dependabot configuration for Software Composition Analysis (SCA)
# Place this file at: .github/dependabot.yml (NOT inside workflows/)

version: 2
updates:

  # --- Maven dependencies ---
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "sca"
    commit-message:
      prefix: "chore(deps)"

  # --- GitHub Actions dependencies ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"